<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Database Contents - Aszune AI Bot Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="dashboard">
      <!-- Shared header + navigation (shell.js) -->
      <script src="shell.js"></script>

      <!-- Database Contents Section -->
      <div class="database-section">
        <h2>💾 Database Contents (Read-Only)</h2>
        <div class="database-controls">
          <select id="database-table-select" class="table-select">
            <option value="">Select a table...</option>
            <option value="user_stats" selected>user_stats</option>
            <option value="conversation_history">conversation_history</option>
            <option value="reminders">reminders</option>
          </select>
          <input
            type="text"
            id="database-search"
            class="database-search"
            placeholder="Search table..."
          />
          <span id="table-info" class="table-info">Loading...</span>
        </div>
        <div id="database-viewer" class="database-viewer">
          <div class="db-message">Select a table to view data...</div>
        </div>
      </div>
    </div>

    <!-- Socket.IO and Dashboard Script -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
