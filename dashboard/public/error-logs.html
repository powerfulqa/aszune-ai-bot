<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error Logs - Aszune AI Bot Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="dashboard" id="mainContent">
      <!-- Shared header + navigation (shell.js) -->
      <script src="shell.js"></script>

      <section class="section" id="errorLogsSection">
        <div class="section-header">
          <h2 class="section-title"><span class="section-title-icon">⚠️</span> Error Logs</h2>
        </div>
        <div class="error-logs-section">
          <div class="error-log-container">
            <div id="error-logs">
              <div class="error-log-no-errors">✓ No errors logged - System running smoothly</div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Socket.IO, layout and Dashboard scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="vendor/Sortable.min.js"></script>
    <script src="layout.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
