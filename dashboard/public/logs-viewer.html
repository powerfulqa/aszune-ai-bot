<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aszune AI Bot Dashboard - Logs Viewer</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .logs-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: var(--spacing-md);
        flex-wrap: wrap;
        gap: var(--spacing-sm);
      }

      .logs-controls {
        display: flex;
        gap: var(--spacing-sm);
        align-items: center;
        flex-wrap: wrap;
        flex: 1 1 auto;
        min-width: 0;
      }

      .log-filter {
        cursor: pointer;
      }

      .log-search {
        flex: 1 1 200px;
        min-width: 0;
        max-width: 360px;
      }

      .log-search::placeholder {
        color: var(--text-muted);
      }

      .log-button.pause {
        background: var(--tint-warn);
        color: var(--level-warn);
      }

      .log-button.pause.paused {
        background: var(--tint-ok);
        border-color: var(--tint-ok-border);
        color: var(--level-ok);
      }

      .log-button.export {
        background: var(--tint-accent);
        color: var(--level-accent);
      }

      .log-button.pause:hover:not(:disabled),
      .log-button.export:hover:not(:disabled) {
        filter: brightness(1.1);
      }

      .table-wrapper {
        overflow: auto;
        max-height: 600px;
        background: var(--surface-2);
        border: 1px solid var(--hairline);
        border-radius: var(--border-radius-md);
      }

      .logs-table {
        width: 100%;
        border-collapse: collapse;
        font-size: var(--font-size-xs);
        font-family: var(--font-mono);
      }

      .logs-table thead th {
        position: sticky;
        top: 0;
        background: var(--surface-solid);
        border-bottom: 1px solid var(--hairline-strong);
        z-index: 1;
      }

      .logs-table th {
        padding: 8px 10px;
        text-align: left;
        color: var(--text-muted);
        font-family: inherit;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .logs-table th.col-timestamp {
        width: 180px;
      }

      .logs-table th.col-level {
        width: 80px;
      }

      .logs-table td {
        padding: 6px 10px;
        border-bottom: 1px solid var(--hairline);
        color: var(--text-primary);
        vertical-align: top;
      }

      .logs-table tbody tr:last-child td {
        border-bottom: none;
      }

      .logs-table tbody tr:hover {
        background: var(--surface-hover);
      }

      .log-level-DEBUG,
      .log-level-INFO,
      .log-level-WARN,
      .log-level-ERROR {
        display: inline-block;
        padding: 1px 8px;
        border-radius: var(--radius-pill);
        font-weight: 600;
        font-size: 0.7rem;
        letter-spacing: 0.04em;
      }

      .log-level-DEBUG {
        background: var(--tint-info);
        color: var(--level-info);
      }

      .log-level-INFO {
        background: var(--tint-ok);
        color: var(--level-ok);
      }

      .log-level-WARN {
        background: var(--tint-warn);
        color: var(--level-warn);
      }

      .log-level-ERROR {
        background: var(--tint-danger);
        color: var(--level-danger);
      }

      .log-timestamp {
        color: var(--text-muted);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }

      .logs-table td.log-timestamp {
        color: var(--text-muted);
      }

      .log-message {
        color: var(--text-primary);
        word-break: break-word;
      }

      .logs-footer {
        margin-top: var(--spacing-md);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: var(--spacing-sm);
        font-size: var(--font-size-xs);
        color: var(--text-muted);
      }

      .log-stats {
        display: flex;
        flex-wrap: wrap;
        gap: var(--spacing-sm);
      }

      .log-stat {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 10px;
        background: var(--surface-2);
        border: 1px solid var(--hairline);
        border-radius: var(--radius-pill);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 0.7rem;
      }

      .log-stat-value {
        color: var(--text-primary);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        text-transform: none;
        letter-spacing: 0;
      }

      .live-indicator {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 10px;
        background: var(--tint-ok);
        border: 1px solid var(--tint-ok-border);
        border-radius: var(--radius-pill);
        font-size: var(--font-size-xs);
        font-weight: 600;
        color: var(--level-ok);
      }

      .live-indicator.pulsing::before {
        content: '●';
        animation: live-pulse 1s infinite;
      }

      @keyframes live-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .no-logs {
        padding: 40px;
        text-align: center;
        color: var(--text-muted);
        font-size: var(--font-size-sm);
      }

      .logs-table td.no-logs {
        color: var(--text-muted);
      }

      .legend-item .log-level-DEBUG,
      .legend-item .log-level-INFO,
      .legend-item .log-level-WARN,
      .legend-item .log-level-ERROR {
        flex: 0 0 auto;
        align-self: flex-start;
      }

      .levels-legend {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <main class="dashboard" id="mainContent">
      <!-- Shared header + navigation (shell.js) -->
      <script src="shell.js"></script>

      <!-- Real-Time Log Viewer Section -->
      <section class="section" id="logViewerSection">
        <div class="section-header">
          <h2 class="section-title">
            <span class="section-title-icon">📋</span> Real-Time Log Viewer
          </h2>
          <div class="section-actions">
            <span class="live-indicator pulsing">Live</span>
          </div>
        </div>
        <div class="widget-card">
          <div class="logs-header">
            <div class="logs-controls">
              <select id="log-filter" class="log-filter form-control">
                <option value="ALL">All Levels</option>
                <option value="DEBUG">Debug</option>
                <option value="INFO" selected>Info</option>
                <option value="WARN">Warnings</option>
                <option value="ERROR">Errors</option>
              </select>

              <input
                type="text"
                id="log-search"
                class="log-search form-control"
                placeholder="Search logs (e.g., 'cache', 'API', 'database')..."
              />

              <button class="log-button control-btn pause" onclick="toggleAutoScroll()">
                ⏸ Pause
              </button>

              <button class="log-button control-btn export" onclick="exportLogs()">
                ⬇️ Export
              </button>
            </div>
          </div>

          <div class="table-wrapper">
            <table class="logs-table" id="logs-table">
              <thead>
                <tr>
                  <th class="col-timestamp">Timestamp</th>
                  <th class="col-level">Level</th>
                  <th>Message</th>
                </tr>
              </thead>
              <tbody id="logs-body">
                <!-- Sample logs will be populated here -->
              </tbody>
            </table>
          </div>

          <div class="logs-footer">
            <div class="log-stats">
              <div class="log-stat">
                <span>Total Logs:</span>
                <span class="log-stat-value" id="total-logs">127</span>
              </div>
              <div class="log-stat">
                <span>Errors:</span>
                <span class="log-stat-value" id="error-count">3</span>
              </div>
              <div class="log-stat">
                <span>Warnings:</span>
                <span class="log-stat-value" id="warn-count">12</span>
              </div>
            </div>
            <span id="last-update">Last updated: just now</span>
          </div>
        </div>
      </section>

      <!-- Log Level Legend -->
      <section class="section" id="logLevelsSection">
        <div class="section-header">
          <h2 class="section-title"><span class="section-title-icon">🏷️</span> Log Levels</h2>
        </div>
        <div class="widget-card">
          <div class="legend levels-legend">
            <div class="legend-items">
              <div class="legend-item">
                <span class="log-level-DEBUG">DEBUG</span
                ><span>Detailed diagnostic information</span>
              </div>
              <div class="legend-item">
                <span class="log-level-INFO">INFO</span><span>General informational messages</span>
              </div>
              <div class="legend-item">
                <span class="log-level-WARN">WARN</span
                ><span>Warning messages for potential issues</span>
              </div>
              <div class="legend-item">
                <span class="log-level-ERROR">ERROR</span><span>Error messages for failures</span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Socket.IO, layout and Dashboard scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="vendor/Sortable.min.js"></script>
    <script src="layout.js"></script>
    <script src="dashboard.js"></script>
    <script>
      let autoScroll = true;
      let isPaused = false;
      let allLogs = []; // Store all logs from server

      function renderLogs(logs) {
        const tbody = document.getElementById('logs-body');

        if (logs.length === 0) {
          // Check if we have any logs at all or just filtered all out
          const message =
            allLogs.length === 0
              ? 'Waiting for logs from server...'
              : 'No logs match the current filter';
          tbody.innerHTML = `<tr><td colspan="3" class="no-logs">${message}</td></tr>`;
          return;
        }

        // Reverse logs so latest appears at top
        // Copy before reversing: reverse() mutates, which flipped the stored
        // order on every re-render
        tbody.innerHTML = [...logs]
          .reverse()
          .map((log) => {
            // Format timestamp to human-readable format
            const timestamp = new Date(log.timestamp);
            const formattedTime = timestamp.toLocaleString('en-GB', {
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',
              hour12: false,
            });

            return `
                    <tr>
                        <td class="log-timestamp">${escapeHtml(formattedTime)}</td>
                        <td><span class="log-level-${escapeHtml(log.level)}">${escapeHtml(log.level)}</span></td>
                        <td class="log-message">${escapeHtml(log.message)}</td>
                    </tr>
                `;
          })
          .join('');

        // Update counters
        const errorCount = logs.filter((l) => l.level === 'ERROR').length;
        const warnCount = logs.filter((l) => l.level === 'WARN').length;
        document.getElementById('total-logs').textContent = logs.length;
        document.getElementById('error-count').textContent = errorCount;
        document.getElementById('warn-count').textContent = warnCount;
      }

      function updateLogs() {
        if (isPaused) return;

        const level = document.getElementById('log-filter').value;
        const search = document.getElementById('log-search').value.toLowerCase();

        let filtered = allLogs;

        if (level !== 'ALL') {
          filtered = filtered.filter((l) => l.level === level);
        }

        if (search) {
          filtered = filtered.filter((l) => l.message.toLowerCase().includes(search));
        }

        renderLogs(filtered);
        document.getElementById('last-update').textContent = 'Last updated: just now';
      }

      function toggleAutoScroll() {
        isPaused = !isPaused;
        const btn = event.target;
        btn.textContent = isPaused ? '▶ Resume' : '⏸ Pause';
        btn.classList.toggle('paused', isPaused);
      }

      function exportLogs() {
        const level = document.getElementById('log-filter').value;
        const filtered = level === 'ALL' ? allLogs : allLogs.filter((l) => l.level === level);

        const csv =
          'Timestamp,Level,Message\n' +
          filtered.map((l) => `"${l.timestamp}","${l.level}","${l.message}"`).join('\n');

        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `logs-${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
      }

      function loadLogsFromServer() {
        // Use the dashboard's socket connection
        const dashboardSocket = window.dashboard?.socket;
        if (!dashboardSocket) {
          console.error('Dashboard socket not available');
          return;
        }

        dashboardSocket.emit('request_logs', {}, (response) => {
          if (response && response.logs) {
            allLogs = response.logs;
            updateLogs();
          } else {
            console.error('No logs received from server', response);
          }
        });
      }

      // Event listeners
      document.getElementById('log-filter').addEventListener('change', updateLogs);
      document.getElementById('log-search').addEventListener('input', updateLogs);

      document.addEventListener('DOMContentLoaded', () => {
        whenDashboardReady((socket) => {
          loadLogsFromServer();

          // Live log lines
          socket.on('new_log', (logEntry) => {
            if (!isPaused) {
              allLogs.push(logEntry);
              // Keep only last 500 logs
              if (allLogs.length > 500) {
                allLogs.shift();
              }
              updateLogs();
            }
          });

          // Full refresh every 5 seconds (paused with the button or a hidden tab)
          Poller.every(() => {
            if (!isPaused) {
              loadLogsFromServer();
            }
          }, 5000);
        });
      });
    </script>
  </body>
</html>
