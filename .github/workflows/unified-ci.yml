name: Aszune AI Bot CI/CD

# Optimized CI workflow with parallel test sharding and separate coverage
# - Tests run in 3 parallel shards for faster execution (NO coverage = speed)
# - Coverage run separately as FULL suite (no sharding = accuracy), on PRs and main,
#   followed by the per-file critical coverage gate
# - Quality and security checks run in parallel with tests
# - QLTY analysis runs to trigger maintainability checks

on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main

jobs:
  # QLTY code analysis (triggers maintainability checks)
  qlty:
    name: QLTY Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history for accurate analysis

      - name: Install QLTY CLI
        uses: qltysh/qlty-action/install@v2

      - name: Run QLTY check
        run: qlty check --all --no-progress
        continue-on-error: true # Don't fail CI on code smells

  # Quality and security checks (fast, runs in parallel with tests)
  quality:
    name: Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint . --max-warnings=0

      - name: Security audit
        run: npm audit --audit-level=high --omit=dev

  # Parallel test shards (3x faster than sequential) - NO COVERAGE for speed
  # Matrix over the supported Node LTS lines (Maintenance 22 + Active 24)
  test:
    name: Test (Node ${{ matrix.node }}, Shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        shard: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests (no coverage - speed optimized)
        run: npm test -- --shard=${{ matrix.shard }}/3 --no-coverage --maxWorkers=2 --colors
        env:
          CI: true
          NODE_ENV: test
          FORCE_COLOR: '1'

  # Full coverage run (no sharding for accurate coverage). Runs on pull requests
  # too, so the gates block a merge instead of failing on main afterwards.
  # Jest enforces the global 70% threshold from jest.config.js.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for QLTY OIDC authentication
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite with coverage
        run: npm test -- --coverage --maxWorkers=2 --colors
        env:
          CI: true
          NODE_ENV: test
          FORCE_COLOR: '1'

      # Stricter per-file gates for the critical files
      # (config/jest.critical-coverage.config.js)
      - name: Critical-file coverage gate
        run: npm run test:critical:ci
        env:
          CI: true
          NODE_ENV: test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage/
          fail_ci_if_error: false

      - name: Upload coverage to QLTY
        uses: qltysh/qlty-action/coverage@v2
        continue-on-error: true
        with:
          oidc: true
          files: coverage/lcov.info

  # Final status check (ensures all jobs pass)
  ci-status:
    name: CI Status
    needs: [quality, test, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check CI status
        run: |
          if [[ "${{ needs.quality.result }}" == "failure" || "${{ needs.test.result }}" == "failure" ]]; then
            echo "❌ CI failed"
            exit 1
          fi
          if [[ "${{ needs.coverage.result }}" == "failure" ]]; then
            echo "❌ Coverage check failed"
            exit 1
          fi
          echo "✅ CI passed"
